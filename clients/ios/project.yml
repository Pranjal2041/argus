# Generate the Xcode project with `xcodegen` (brew install xcodegen), then
# build with Xcode or `bash build-ios.sh`. The generated .xcodeproj is not committed.
name: ArgusiOS
options:
  bundleIdPrefix: dev.universaltmux
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftTerm:
    path: ../macos/vendor/SwiftTerm
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${ARGUS_IOS_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  Argus:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: SwiftTerm
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Argus
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Native brokers (a Mac) serve plain http on their tailnet IP; the
        # tailnet (WireGuard) is the transport security, as on macOS/Android.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.universaltmux.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  ArgusTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Argus
  ArgusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Argus
schemes:
  Argus:
    build:
      targets:
        Argus: all
    test:
      targets: [ArgusTests, ArgusUITests]
      environmentVariables:
        ARGUS_UITEST_HUB: ${ARGUS_UITEST_HUB}
